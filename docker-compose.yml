version: '3'

services:
  geekfaka:
    container_name: geekfaka-app
    image: ghcr.io/exynos967/geekfaka:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://geekfaka_user:your_password_here@mysql:3306/geekfaka
      - NEXT_PUBLIC_URL=http://localhost:3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      - COOKIE_NAME=geekfaka_session
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 32 bytes}
      - COUPON_API_KEY=${COUPON_API_KEY:-} # 留空则禁用批量优惠码 API
    depends_on:
      - mysql
    volumes:
      - geekfaka_uploads:/app/public/uploads

  mysql:
    image: mysql:8.0
    container_name: geekfaka-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=geekfaka_root_secret
      - MYSQL_DATABASE=geekfaka
      - MYSQL_USER=geekfaka_user
      - MYSQL_PASSWORD=your_password_here
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  geekfaka_uploads:
